<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Silence benign [vite] websocket connection notices and unhandled rejections in sandboxed preview
      (function() {
        function isViteMsg(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.indexOf('[vite]') !== -1 || 
                 str.indexOf('WebSocket') !== -1 || 
                 str.indexOf('websocket') !== -1 || 
                 str.indexOf('failed to connect to websocket') !== -1 ||
                 str.indexOf('failed to connect') !== -1;
        }
        var _err = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) {
              return;
            }
          }
          _err.apply(console, arguments);
        };
        var _warn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) {
              return;
            }
          }
          _warn.apply(console, arguments);
        };
        var _log = console.log;
        console.log = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) {
              return;
            }
          }
          _log.apply(console, arguments);
        };
        var _debug = console.debug;
        console.debug = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) {
              return;
            }
          }
          if (_debug) _debug.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && isViteMsg(e.reason)) {
            e.preventDefault();
          }
        });
      })();
    </script>

        window.addEventListener('load', function() {
