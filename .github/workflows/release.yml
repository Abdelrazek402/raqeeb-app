name: Raqeeb release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: npm ci
      - run: npm run test:firestore-rules
      - run: npm run test:anti-fake
      - run: npm run test:extension
      - run: npm run test:analytics-data
      - run: npm run lint
      - run: npm run build
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: web-and-extension
          path: |
            public/downloads/Raqeeb-Extension.zip
            dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: ./android
      - name: Configure Firebase Android app
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "::error::Set the ANDROID_GOOGLE_SERVICES_JSON_BASE64 repository secret from the Firebase Android app configuration."
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json
        working-directory: ./android
      - name: Validate Android release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required GitHub Actions secret ${secret_name} is not set."
              exit 1
            fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Decode Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RAQEEB_KEYSTORE_PATH"
          test -s "$RAQEEB_KEYSTORE_PATH"
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAQEEB_KEYSTORE_PATH: ${{ runner.temp }}/raqeeb-release.keystore
      - name: Build Android release
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: ./android
        env:
          CI: 'true'
          RAQEEB_KEYSTORE_PATH: ${{ runner.temp }}/raqeeb-release.keystore
          RAQEEB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAQEEB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RAQEEB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify Android release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=''
          apkanalyzer=''
          if command -v apksigner >/dev/null 2>&1; then
            apksigner="$(command -v apksigner)"
          elif [[ -n "$sdk_path" && -d "$sdk_path/build-tools" ]]; then
            apksigner="$(find "$sdk_path/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          fi
          if [[ -n "$apksigner" ]]; then
            "$apksigner" verify --verbose --print-certs "$apk"
          else
            echo "::error::apksigner is unavailable; refusing to publish an unverified APK."
            exit 1
          fi
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer="$(command -v apkanalyzer)"
          elif [[ -n "$sdk_path" && -d "$sdk_path/cmdline-tools" ]]; then
            apkanalyzer="$(find "$sdk_path/cmdline-tools" -type f -name apkanalyzer -print | head -n 1)"
          fi
          if [[ -z "$apkanalyzer" ]]; then
            echo "::error::apkanalyzer is unavailable; APK metadata could not be verified."
            exit 1
          fi
          [[ "$("$apkanalyzer" manifest application-id "$apk")" == "com.raqeeb.app" ]]
          [[ "$("$apkanalyzer" manifest version-name "$apk")" == "1.0.0" ]]
          [[ "$("$apkanalyzer" manifest version-code "$apk")" == "1" ]]
          [[ "$(stat -c '%s' "$apk")" -gt 100000 ]]
          mkdir -p public/downloads
          cp "$apk" public/downloads/Raqeeb.apk
          test -s public/downloads/Raqeeb.apk
      - name: Remove temporary Android keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/raqeeb-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: public/downloads/Raqeeb.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run prepare:windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained WebView2 desktop app
        run: dotnet publish windows-native/RaqeebProtector/RaqeebProtector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o windows-native/publish
      - name: Stage Windows release executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/downloads | Out-Null
          Copy-Item windows-native/publish/RaqeebProtector.exe public/downloads/Raqeeb-Setup.exe
          $path = (Resolve-Path public/downloads/Raqeeb-Setup.exe).Path
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 5MB) { throw 'The Windows executable is unexpectedly small.' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'The Windows executable has no DOS header.' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw 'The Windows PE header offset is invalid.' }
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw 'The Windows PE signature is invalid.' }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw 'The Windows executable is not x64.' }
          if (-not (Test-Path windows-native/RaqeebProtector/wwwroot-assets.zip)) { throw 'The embedded WebView2 site archive is missing.' }
          if (-not (Test-Path windows-native/RaqeebProtector/blocked-domains.txt)) { throw 'The embedded blocklist resource is missing.' }
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($path)
          if ($null -eq $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) { throw 'The Windows executable does not contain a usable application icon.' }
          $icon.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: windows-protector
          path: public/downloads/Raqeeb-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Validate release assets
        run: |
          test -s release/Raqeeb.apk
          test -s release/Raqeeb-Setup.exe
          test -s release/public/downloads/Raqeeb-Extension.zip
          cp release/public/downloads/Raqeeb-Extension.zip release/Raqeeb-Extension.zip
          (cd release && sha256sum Raqeeb.apk > Raqeeb.apk.sha256)
          (cd release && sha256sum Raqeeb-Setup.exe > Raqeeb-Setup.exe.sha256)
          (cd release && sha256sum Raqeeb-Extension.zip > Raqeeb-Extension.zip.sha256)
          (cd release && sha256sum --check Raqeeb.apk.sha256 Raqeeb-Setup.exe.sha256 Raqeeb-Extension.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Raqeeb-release-bundle
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Raqeeb.apk
            release/Raqeeb.apk.sha256
            release/Raqeeb-Setup.exe
            release/Raqeeb-Setup.exe.sha256
            release/Raqeeb-Extension.zip
            release/Raqeeb-Extension.zip.sha256
