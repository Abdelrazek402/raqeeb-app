name: Raqeeb release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: web-and-extension
          path: |
            public/downloads/Raqeeb-Extension.zip
            dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: ./android
      - name: Build Android release
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: ./android
      - run: test -s app/build/outputs/apk/release/app-release.apk
        working-directory: ./android
      - run: mkdir -p public/downloads && cp android/app/build/outputs/apk/release/app-release.apk public/downloads/Raqeeb.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: public/downloads/Raqeeb.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish windows-native/RaqeebProtector/RaqeebProtector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows-native/publish
      - run: New-Item -ItemType Directory -Force public/downloads | Out-Null; Copy-Item windows-native/publish/RaqeebProtector.exe public/downloads/Raqeeb-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-protector
          path: public/downloads/Raqeeb-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: Raqeeb-release-bundle
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Raqeeb.apk
            release/Raqeeb-Setup.exe
            release/Raqeeb-Extension.zip
