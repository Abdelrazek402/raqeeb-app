name: Build Raqeeb Android Signed APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle & Debug Keystore
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Prepare APK Artifact
        run: |
          mkdir -p public/downloads
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/Raqeeb.apk
            echo "Successfully copied app-debug.apk to public/downloads/Raqeeb.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raqeeb-Android-APK
          path: public/downloads/Raqeeb.apk
          retention-days: 30
