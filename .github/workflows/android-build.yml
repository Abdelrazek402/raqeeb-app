name: Validate Android debug build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Firebase Android app
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "::error::Set the ANDROID_GOOGLE_SERVICES_JSON_BASE64 repository secret from the Firebase Android app configuration."
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle & Debug Keystore
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android debug APK
        run: ./android/gradlew -p android assembleDebug --stacktrace
