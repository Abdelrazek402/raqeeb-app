plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.raqeeb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.raqeeb.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    def releaseSigningValues = [
        RAQEEB_KEYSTORE_PATH: System.getenv('RAQEEB_KEYSTORE_PATH'),
        RAQEEB_KEYSTORE_PASSWORD: System.getenv('RAQEEB_KEYSTORE_PASSWORD'),
        RAQEEB_KEY_ALIAS: System.getenv('RAQEEB_KEY_ALIAS'),
        RAQEEB_KEY_PASSWORD: System.getenv('RAQEEB_KEY_PASSWORD')
    ]
    def missingReleaseSigningValues = releaseSigningValues.findAll { name, value ->
        value == null || value.trim().isEmpty()
    }.keySet()

    signingConfigs {
        release {
            if (releaseSigningValues.RAQEEB_KEYSTORE_PATH) {
                storeFile file(releaseSigningValues.RAQEEB_KEYSTORE_PATH)
            }
            if (releaseSigningValues.RAQEEB_KEYSTORE_PASSWORD) {
                storePassword releaseSigningValues.RAQEEB_KEYSTORE_PASSWORD
            }
            if (releaseSigningValues.RAQEEB_KEY_ALIAS) {
                keyAlias releaseSigningValues.RAQEEB_KEY_ALIAS
            }
            if (releaseSigningValues.RAQEEB_KEY_PASSWORD) {
                keyPassword releaseSigningValues.RAQEEB_KEY_PASSWORD
            }
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        if (taskGraph.allTasks.any { task -> task.name.toLowerCase().contains('release') }) {
            if (!missingReleaseSigningValues.isEmpty()) {
                throw new GradleException(
                    "Cannot build an Android release: set these environment variables: " +
                    missingReleaseSigningValues.join(', ')
                )
            }
            if (!file(releaseSigningValues.RAQEEB_KEYSTORE_PATH).isFile()) {
                throw new GradleException(
                    "Cannot build an Android release: RAQEEB_KEYSTORE_PATH does not point to a keystore file."
                )
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
